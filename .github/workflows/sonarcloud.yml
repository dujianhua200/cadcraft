name: SonarCloud

on:
  # FORK: manual only. Upstream runs this on every push/PR, but this fork has no
  # SONAR_TOKEN secret, so those runs would fail permanently. Run it by hand if
  # SonarCloud is ever provisioned for the fork.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  # A push to main is the run that publishes coverage; superseded runs there would never finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonarcloud:
    # Tracked at @main so org-wide CI improvements propagate without PR churn.
    uses: storytold/craft-common-actions/.github/workflows/sonarcloud.yml@main
    secrets: inherit
